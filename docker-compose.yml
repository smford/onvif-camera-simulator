version: '3.8'

services:
  onvif-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    image: onvif-camera-simulator:latest
    container_name: onvif-camera-simulator
    restart: unless-stopped
    # CRITICAL: network_mode: host is required for WS-Discovery UDP multicast (239.255.255.250:3702)
    # to bridge seamlessly to physical LAN NVRs (Frigate, Shinobi, Milestone, Synology).
    network_mode: host
    environment:
      - TZ=UTC
    volumes:
      - ./config.yaml:/app/config.yaml:rw
    command: ["--no-tui", "--config", "/app/config.yaml"]
