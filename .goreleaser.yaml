version: 2

project_name: onvif-camera-simulator

before:
  hooks:
    - go mod tidy

builds:
  - id: onvif-camera-simulator
    main: ./cmd/simulator
    binary: simulator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7 # Raspberry Pi 2/3/4/Zero 2 in 32-bit mode
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.GitCommit={{.Commit}}
      - -X main.BuildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files:
      - LICENSE*
      - README*
      - config.yaml
      - systemd/onvif-camera-simulator.service

# Native Linux packages:
# - deb: Debian, Ubuntu, Linux Mint, Raspberry Pi OS
# - rpm: Red Hat Enterprise Linux (RHEL), CentOS, Fedora, Rocky Linux, AlmaLinux
# - apk: Alpine Linux
# - archlinux: Arch Linux, Manjaro
nfpms:
  - id: onvif-camera-simulator-packages
    package_name: onvif-camera-simulator
    vendor: smford
    homepage: https://github.com/smford/onvif-camera-simulator
    maintainer: "Stephen Ford <https://github.com/smford>"
    description: "Pure Go ONVIF Profile S/T/M and RTSP camera simulator with virtual PTZ and fleet scaling"
    license: "MIT"
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    file_name_template: >-
      {{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    contents:
      - src: config.yaml
        dst: /etc/onvif-camera-simulator/config.yaml
        type: config|noreplace
      - src: systemd/onvif-camera-simulator.service
        dst: /lib/systemd/system/onvif-camera-simulator.service
    scripts:
      postinstall: scripts/postinstall.sh

dockers_v2:
  - id: onvif-camera-simulator
    images:
      - "ghcr.io/smford/onvif-camera-simulator"
    tags:
      - "latest"
      - "{{ .Tag }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "v{{ .Major }}"
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64

checksum:
  name_template: 'checksums.txt'

signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    certificate: '${artifact}.pem'
    args:
      - "sign-blob"
      - "--yes"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
    output: true

docker_signs:
  - id: cosign
    cmd: cosign
    artifacts: all
    args:
      - "sign"
      - "--yes"
      - "${artifact}"
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: smford
    name: onvif-camera-simulator
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## onvif-camera-simulator {{ .Tag }} ({{ .Date }})

    Welcome to the latest release of `onvif-camera-simulator`!
