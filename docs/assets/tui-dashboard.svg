<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" width="1120" height="740">
  <defs>
    <style>
      .tui { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Monaco, Consolas, 'Courier New', monospace; font-size: 13px; font-variant-ligatures: none; fill: #e2e8f0; }
      .dim { fill: #94a3b8; }
      .dark-dim { fill: #64748b; }
      .cyan { fill: #38bdf8; font-weight: 700; }
      .purple { fill: #818cf8; }
      .pink { fill: #f472b6; }
      .green { fill: #10b981; font-weight: 700; }
      .amber { fill: #f59e0b; }
      .red { fill: #ef4444; }
      .bold { font-weight: 700; }
      .border { stroke: #3d4255; stroke-width: 1.5; fill: none; }
    </style>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="15" y="15" width="1090" height="710" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#winShadow)"/>

  <!-- Window Header Bar -->
  <path d="M 15 27 Q 15 15 27 15 L 1093 15 Q 1105 15 1105 27 L 1105 50 L 15 50 Z" fill="#1e293b"/>
  <line x1="15" y1="50" x2="1105" y2="50" stroke="#334155" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="38" cy="32" r="6" fill="#ef4444"/>
  <circle cx="58" cy="32" r="6" fill="#f59e0b"/>
  <circle cx="78" cy="32" r="6" fill="#10b981"/>
  <text x="560" y="36" text-anchor="middle" class="tui dark-dim" font-size="12">onvif-camera-simulator — terminal user interface</text>

  <!-- 1. Top Navigation Tab Bar -->
  <g transform="translate(35, 68)">
    <!-- Tab 1: Dashboard (Active) -->
    <rect x="0" y="0" width="135" height="24" rx="3" fill="#2563eb"/>
    <text x="67" y="16" text-anchor="middle" class="tui bold" fill="#ffffff" font-size="12"> [1] Dashboard </text>

    <!-- Tab 2: Configuration -->
    <rect x="145" y="0" width="165" height="24" rx="3" fill="#1e293b"/>
    <text x="227" y="16" text-anchor="middle" class="tui dim" font-size="12"> [2] Configuration </text>

    <!-- Tab 3: Event Log -->
    <rect x="320" y="0" width="135" height="24" rx="3" fill="#1e293b"/>
    <text x="387" y="16" text-anchor="middle" class="tui dim" font-size="12"> [3] Event Log </text>
  </g>

  <!-- 2. System Overview Banner -->
  <g transform="translate(35, 102)">
    <rect x="0" y="0" width="220" height="26" fill="#5a56e0"/>
    <text x="110" y="17" text-anchor="middle" class="tui bold" fill="#ffffff" font-size="12"> ONVIF &amp; RTSP SRE SIMULATOR </text>

    <rect x="220" y="0" width="830" height="26" fill="#1e212b"/>
    <text x="235" y="17" class="tui" fill="#a0a5b5" font-size="12">Uptime: 01h 24m | CPU/Go: 14 gr | Mem: 18.2 MB | Fleet: 4 cams | RTSP Clients: 3 | Bitrate: 4090.5 kbps</text>
  </g>

  <!-- 3. Camera Endpoints & URLs Card -->
  <g transform="translate(35, 140)">
    <rect x="0" y="0" width="1050" height="114" rx="6" fill="#121826" stroke="#3d4255" stroke-width="1.5"/>
    <text x="16" y="24" class="tui bold" fill="#ffffff">Camera Endpoints &amp; URLs [cam0]  (Switch camera with '[' / ']')</text>

    <!-- Row 1: ONVIF -->
    <text x="16" y="48" class="tui cyan">ONVIF XAddr:</text>
    <text x="130" y="48" class="tui bold">http://127.0.0.1:8000/onvif/cam0/device_service</text>
    <text x="540" y="48" class="tui dim">(SOAP Profile S/T/M Core &amp; Pull-Point)</text>

    <!-- Row 2: Snapshot -->
    <text x="16" y="68" class="tui cyan">Snapshot:</text>
    <text x="130" y="68" class="tui bold">http://127.0.0.1:8000/onvif/cam0/snapshot</text>
    <text x="490" y="68" class="tui dim">(Live JPEG with PTZ crosshairs &amp; event boxes)</text>

    <!-- Row 3: RTSP Main -->
    <text x="16" y="88" class="tui cyan">RTSP Main:</text>
    <text x="130" y="88" class="tui bold">rtsp://127.0.0.1:8554/live/cam0/main</text>
    <text x="460" y="88" class="tui dim">(1920x1080 @ 20fps, H.264+PCMU (root alias: /live/main))</text>

    <!-- Row 4: RTSP Sub -->
    <text x="16" y="106" class="tui cyan">RTSP Sub:</text>
    <text x="130" y="106" class="tui bold">rtsp://127.0.0.1:8554/live/cam0/sub</text>
    <text x="450" y="106" class="tui dim">(640x360 @ 10fps, H.264+PCMU)</text>
  </g>

  <!-- 4. Middle Row: PTZ Kinematics (Left) and Events & Chaos (Right) -->
  <!-- Left: PTZ Card -->
  <g transform="translate(35, 266)">
    <rect x="0" y="0" width="515" height="150" rx="6" fill="#121826" stroke="#3d4255" stroke-width="1.5"/>
    <text x="16" y="24" class="tui bold" fill="#ffffff">Virtual PTZ Kinematics [cam0] (Switch with '[' / ']')</text>
    <rect x="400" y="11" width="102" height="18" fill="#10b981" rx="2"/>
    <text x="451" y="24" text-anchor="middle" class="tui bold" fill="#ffffff" font-size="11">STATUS: MOVING</text>

    <!-- PAN Gauge -->
    <text x="16" y="52" class="tui">PAN</text>
    <text x="70" y="52" class="tui"><tspan class="cyan">█████████████████████</tspan><tspan fill="#334155">░░░░░░░░░</tspan>   0.45</text>

    <!-- TILT Gauge -->
    <text x="16" y="74" class="tui">TILT</text>
    <text x="70" y="74" class="tui"><tspan class="purple">████████████</tspan><tspan fill="#334155">░░░░░░░░░░░░░░░░░░</tspan>  -0.20</text>

    <!-- ZOOM Gauge -->
    <text x="16" y="96" class="tui">ZOOM</text>
    <text x="70" y="96" class="tui"><tspan class="pink">██████████████████</tspan><tspan fill="#334155">░░░░░░░░░░░░</tspan>   0.60</text>

    <!-- Last Action -->
    <text x="16" y="132" class="tui dim" font-size="11">Last Action: ContinuousMove | Position: [0.45, -0.20, 0.60]</text>
  </g>

  <!-- Right: Events & Chaos Card -->
  <g transform="translate(570, 266)">
    <rect x="0" y="0" width="515" height="150" rx="6" fill="#121826" stroke="#3d4255" stroke-width="1.5"/>
    <text x="16" y="24" class="tui bold" fill="#ffffff">WS-BaseNotification Events &amp; SRE Chaos</text>

    <!-- Badges Row 1 -->
    <g transform="translate(16, 38)">
      <rect x="0" y="0" width="112" height="18" fill="#10b981" rx="2"/>
      <text x="56" y="13" text-anchor="middle" class="tui bold" fill="#ffffff" font-size="11">MOTION: ACTIVE</text>

      <rect x="122" y="0" width="124" height="18" fill="#10b981" rx="2"/>
      <text x="184" y="13" text-anchor="middle" class="tui bold" fill="#ffffff" font-size="11">HUMAN: DETECTED</text>

      <rect x="256" y="0" width="105" height="18" fill="#334155" rx="2"/>
      <text x="308" y="13" text-anchor="middle" class="tui dim" font-size="11">VEHICLE: IDLE</text>
    </g>

    <!-- Badges Row 2 -->
    <g transform="translate(16, 62)">
      <rect x="0" y="0" width="120" height="18" fill="#334155" rx="2"/>
      <text x="60" y="13" text-anchor="middle" class="tui dim" font-size="11">STREAM: RUNNING</text>

      <rect x="130" y="0" width="115" height="18" fill="#334155" rx="2"/>
      <text x="187" y="13" text-anchor="middle" class="tui dim" font-size="11">SYSTEM: ONLINE</text>
    </g>

    <!-- Hotkeys -->
    <g transform="translate(16, 102)">
      <text x="0" y="0" class="tui font-size-11">
        <tspan class="cyan">[m]</tspan> Toggle Motion   <tspan class="cyan">[h]</tspan> Burst Human (5s)   <tspan class="cyan">[v]</tspan> Burst Vehicle (5s)
      </text>
      <text x="0" y="20" class="tui font-size-11">
        <tspan class="cyan">[x]</tspan> Freeze Stream   <tspan class="cyan">[b]</tspan> Hard Reboot (5s)   <tspan class="cyan">[1..3]</tspan> Switch Tabs
      </text>
    </g>
  </g>

  <!-- 5. Active RTSP Sessions & Connections Table Card -->
  <g transform="translate(35, 428)">
    <rect x="0" y="0" width="1050" height="135" rx="6" fill="#121826" stroke="#3d4255" stroke-width="1.5"/>
    <text x="16" y="24" class="tui bold" fill="#ffffff">Active RTSP Sessions &amp; Connections</text>

    <!-- Header Row -->
    <text x="20" y="46" class="tui bold dim"> Client IP           Cam     Stream    Transport   User-Agent            State     Duration    Bitrate (kbps) </text>
    <line x1="16" y1="54" x2="1034" y2="54" stroke="#4b5563" stroke-width="1"/>

    <!-- Row 1 -->
    <text x="20" y="74" class="tui"> 192.168.1.104:54210  cam0    main      TCP         Frigate/0.14.1        PLAY      14m 20s     3250.5 </text>
    <!-- Row 2 -->
    <text x="20" y="94" class="tui"> 192.168.1.150:49182  cam0    sub       TCP         HomeAssistant/2026.3  PLAY      14m 20s      840.0 </text>
    <!-- Row 3 -->
    <text x="20" y="114" class="tui"> 127.0.0.1:58920     cam1    main      TCP         go2rtc/1.9.4          PLAY       2m 05s     3190.0 </text>
  </g>

  <!-- 6. Recent ONVIF SOAP Security & Audit Trail Card -->
  <g transform="translate(35, 575)">
    <rect x="0" y="0" width="1050" height="120" rx="6" fill="#121826" stroke="#3d4255" stroke-width="1.5"/>
    <text x="16" y="24" class="tui bold" fill="#ffffff">Recent ONVIF SOAP Security &amp; Audit Trail (Last 8 Requests)</text>

    <text x="16" y="48" class="tui">  14:03:09.767 <tspan class="green">[SUCCESS]</tspan> | cam0   | 192.168.1.104:54210 | GetDeviceInformation</text>
    <text x="16" y="68" class="tui">  14:03:09.767 <tspan class="green">[SUCCESS]</tspan> | cam0   | 192.168.1.104:54210 | GetStreamUri</text>
    <text x="16" y="88" class="tui">  14:03:09.767 <tspan class="green">[SUCCESS]</tspan> | cam0   | 192.168.1.150:49182 | PullMessages</text>
    <text x="16" y="108" class="tui">  14:03:09.767 <tspan class="amber">[ANON   ]</tspan> | cam0   | 192.168.1.188:59100 | SystemReboot</text>
  </g>
</svg>
