<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .term-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #e2e8f0; }
      .term-dim { fill: #64748b; }
      .term-cyan { fill: #38bdf8; font-weight: 500; }
      .term-green { fill: #34d399; font-weight: 500; }
      .term-yellow { fill: #fbbf24; font-weight: 500; }
      .term-purple { fill: #a78bfa; font-weight: 500; }
      .term-red { fill: #f87171; font-weight: 500; }
      .term-bold { font-weight: 700; }
    </style>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="20" y="20" width="1060" height="640" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Header Bar -->
  <path d="M 20 34 Q 20 20 34 20 L 1066 20 Q 1080 20 1080 34 L 1080 58 L 20 58 Z" fill="#1e293b"/>
  <line x1="20" y1="58" x2="1080" y2="58" stroke="#334155" stroke-width="1"/>

  <!-- Traffic Lights -->
  <circle cx="45" cy="39" r="6" fill="#ef4444"/>
  <circle cx="65" cy="39" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="39" r="6" fill="#10b981"/>

  <!-- Window Title -->
  <text x="550" y="43" text-anchor="middle" class="term-text term-dim" font-size="12">onvif-camera-simulator &bull; interactive TUI dashboard (fleet: 4 cameras)</text>

  <!-- Top Banner inside TUI -->
  <g transform="translate(40, 75)">
    <!-- Brand Box -->
    <rect x="0" y="0" width="220" height="28" rx="4" fill="url(#headerGrad)"/>
    <text x="110" y="19" text-anchor="middle" class="term-text term-bold" fill="#ffffff">ONVIF &amp; RTSP SRE SIMULATOR</text>

    <!-- Info Bar -->
    <rect x="225" y="0" width="795" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="240" y="19" class="term-text" font-size="12">
      <tspan class="term-dim">Uptime:</tspan> <tspan class="term-green">02h 15m</tspan>
      <tspan class="term-dim"> | Goroutines:</tspan> <tspan class="term-cyan">18</tspan>
      <tspan class="term-dim"> | Mem:</tspan> <tspan class="term-purple">19.2 MB</tspan>
      <tspan class="term-dim"> | Fleet:</tspan> <tspan class="term-yellow">4 cams</tspan>
      <tspan class="term-dim"> | RTSP Clients:</tspan> <tspan class="term-green">3</tspan>
      <tspan class="term-dim"> | Ingress:</tspan> <tspan class="term-cyan">4,120 kbps</tspan>
    </text>
  </g>

  <!-- Tab Bar -->
  <g transform="translate(40, 115)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="65" y="16" text-anchor="middle" class="term-text term-cyan" font-size="11">[1] Dashboard</text>

    <rect x="140" y="0" width="120" height="24" rx="4" fill="#1e293b"/>
    <text x="200" y="16" text-anchor="middle" class="term-text term-dim" font-size="11">[2] Live Logs</text>

    <rect x="270" y="0" width="140" height="24" rx="4" fill="#1e293b"/>
    <text x="340" y="16" text-anchor="middle" class="term-text term-dim" font-size="11">[3] Configuration</text>

    <text x="1020" y="17" text-anchor="end" class="term-text term-dim" font-size="11">Selected Camera: <tspan class="term-cyan">[cam0]</tspan> (switch: '[' or ']')</text>
  </g>

  <!-- Card 1: Endpoints -->
  <g transform="translate(40, 150)">
    <rect x="0" y="0" width="1020" height="88" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" class="term-text term-cyan term-bold">📡 Camera Endpoints &amp; Stream URLs (cam0)</text>

    <text x="20" y="50" class="term-text" font-size="12">
      <tspan class="term-dim">Main RTSP (1080p20): </tspan><tspan class="term-green">rtsp://127.0.0.1:8554/live/cam0/main</tspan>
      <tspan dx="40" class="term-dim">Sub RTSP (360p10): </tspan><tspan class="term-green">rtsp://127.0.0.1:8554/live/cam0/sub</tspan>
    </text>
    <text x="20" y="72" class="term-text" font-size="12">
      <tspan class="term-dim">ONVIF Device:      </tspan><tspan class="term-purple">http://127.0.0.1:8000/onvif/cam0/device_service</tspan>
      <tspan dx="15" class="term-dim">Dynamic Snapshot: </tspan><tspan class="term-yellow">http://127.0.0.1:8000/onvif/cam0/snapshot</tspan>
    </text>
  </g>

  <!-- Middle Row: Left (PTZ Kinematics) & Right (Events & Chaos) -->
  <!-- Middle Left: PTZ -->
  <g transform="translate(40, 250)">
    <rect x="0" y="0" width="500" height="155" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" class="term-text term-purple term-bold">🕹️ Virtual PTZ Kinematics</text>
    <rect x="400" y="10" width="85" height="18" rx="3" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
    <text x="442" y="23" text-anchor="middle" class="term-text term-green" font-size="10">MOVING</text>

    <!-- Gauges -->
    <text x="20" y="55" class="term-text" font-size="12">PAN</text>
    <rect x="70" y="44" width="300" height="14" rx="3" fill="#0f172a" stroke="#334155"/>
    <rect x="70" y="44" width="210" height="14" rx="3" fill="#38bdf8"/>
    <text x="385" y="56" class="term-text term-cyan" font-size="12">+0.42</text>

    <text x="20" y="80" class="term-text" font-size="12">TILT</text>
    <rect x="70" y="69" width="300" height="14" rx="3" fill="#0f172a" stroke="#334155"/>
    <rect x="70" y="69" width="130" height="14" rx="3" fill="#818cf8"/>
    <text x="385" y="81" class="term-text term-purple" font-size="12">-0.15</text>

    <text x="20" y="105" class="term-text" font-size="12">ZOOM</text>
    <rect x="70" y="94" width="300" height="14" rx="3" fill="#0f172a" stroke="#334155"/>
    <rect x="70" y="94" width="180" height="14" rx="3" fill="#34d399"/>
    <text x="385" y="106" class="term-text term-green" font-size="12">1.8x</text>

    <text x="20" y="136" class="term-text term-dim" font-size="11">Presets: <tspan class="term-cyan">[1] Gate</tspan> &bull; <tspan class="term-cyan">[2] Parking</tspan> &bull; <tspan class="term-cyan">[3] Doorway</tspan> &bull; Velocity clamping active</text>
  </g>

  <!-- Middle Right: Events & Chaos -->
  <g transform="translate(560, 250)">
    <rect x="0" y="0" width="500" height="155" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" class="term-text term-amber term-bold">🔔 Events &amp; SRE Chaos Controls</text>

    <g transform="translate(20, 42)">
      <!-- Motion -->
      <rect x="0" y="0" width="70" height="20" rx="3" fill="#10b981" fill-opacity="0.25" stroke="#10b981"/>
      <text x="35" y="14" text-anchor="middle" class="term-text term-green" font-size="10">MOTION</text>
      <text x="80" y="15" class="term-text" font-size="12">Active (CellGrid 16x16) <tspan class="term-cyan">[m]</tspan></text>

      <!-- Person Detection -->
      <rect x="0" y="26" width="70" height="20" rx="3" fill="#10b981" fill-opacity="0.25" stroke="#10b981"/>
      <text x="35" y="40" text-anchor="middle" class="term-text term-green" font-size="10">PERSON</text>
      <text x="80" y="41" class="term-text" font-size="12">Profile T/M Conf 96% <tspan class="term-cyan">[p]</tspan></text>

      <!-- Vehicle Detection -->
      <rect x="0" y="52" width="70" height="20" rx="3" fill="#334155"/>
      <text x="35" y="66" text-anchor="middle" class="term-text term-dim" font-size="10">VEHICLE</text>
      <text x="80" y="67" class="term-text term-dim" font-size="12">Idle (No targets) <tspan class="term-cyan">[v]</tspan></text>

      <!-- Chaos State -->
      <line x1="0" y1="80" x2="460" y2="80" stroke="#334155" stroke-dasharray="3 3"/>
      <text x="0" y="98" class="term-text font-size-11">
        <tspan class="term-dim">Chaos Engine: </tspan><tspan class="term-green">HEALTHY</tspan>
        <tspan class="term-dim"> | Hotkeys: </tspan>
        <tspan class="term-red">[f]</tspan><tspan class="term-dim">reeze </tspan>
        <tspan class="term-yellow">[r]</tspan><tspan class="term-dim">eboot </tspan>
        <tspan class="term-purple">[l]</tspan><tspan class="term-dim">oss </tspan>
        <tspan class="term-green">[c]</tspan><tspan class="term-dim">lear</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Row: Active Clients Table & Live Logs -->
  <g transform="translate(40, 420)">
    <rect x="0" y="0" width="1020" height="215" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" class="term-text term-green term-bold">👥 Active RTSP Clients &amp; Live Ingest Pipeline</text>

    <!-- Table Header -->
    <rect x="15" y="38" width="990" height="22" fill="#0f172a" rx="3"/>
    <text x="25" y="53" class="term-text term-dim" font-size="11">CLIENT ADDRESS</text>
    <text x="230" y="53" class="term-text term-dim" font-size="11">TARGET MOUNT</text>
    <text x="440" y="53" class="term-text term-dim" font-size="11">CODEC / RES</text>
    <text x="610" y="53" class="term-text term-dim" font-size="11">BITRATE</text>
    <text x="740" y="53" class="term-text term-dim" font-size="11">PACKETS</text>
    <text x="890" y="53" class="term-text term-dim" font-size="11">CONSUMER</text>

    <!-- Row 1 -->
    <text x="25" y="78" class="term-text" font-size="11">192.168.1.104:54210</text>
    <text x="230" y="78" class="term-text term-cyan" font-size="11">/live/cam0/main</text>
    <text x="440" y="78" class="term-text" font-size="11">H.264 1080p20</text>
    <text x="610" y="78" class="term-text term-green" font-size="11">3,240 kbps</text>
    <text x="740" y="78" class="term-text" font-size="11">148,920</text>
    <text x="890" y="78" class="term-text term-yellow" font-size="11">Frigate NVR</text>

    <!-- Row 2 -->
    <text x="25" y="98" class="term-text" font-size="11">192.168.1.150:49182</text>
    <text x="230" y="98" class="term-text term-cyan" font-size="11">/live/cam0/sub</text>
    <text x="440" y="98" class="term-text" font-size="11">H.264 360p10</text>
    <text x="610" y="98" class="term-text term-green" font-size="11">880 kbps</text>
    <text x="740" y="98" class="term-text" font-size="11">41,200</text>
    <text x="890" y="98" class="term-text term-purple" font-size="11">Home Assistant</text>

    <!-- Row 3 -->
    <text x="25" y="118" class="term-text" font-size="11">127.0.0.1:51884</text>
    <text x="230" y="118" class="term-text term-cyan" font-size="11">/live/cam1/main</text>
    <text x="440" y="118" class="term-text" font-size="11">H.264 1080p20</text>
    <text x="610" y="118" class="term-text term-green" font-size="11">3,190 kbps</text>
    <text x="740" y="118" class="term-text" font-size="11">22,410</text>
    <text x="890" y="78" class="term-text term-cyan" font-size="11">go2rtc WebRTC</text>

    <!-- Audit Log Separator -->
    <line x1="15" y1="134" x2="1005" y2="134" stroke="#334155"/>
    <text x="25" y="152" class="term-text term-dim" font-size="11">13:42:10.104 <tspan class="term-cyan">[INFO]</tspan> ws-discovery: ProbeMatch returned for Target &lt;onvif://cam0&gt; to 239.255.255.250:3702</text>
    <text x="25" y="170" class="term-text term-dim" font-size="11">13:42:11.512 <tspan class="term-green">[INFO]</tspan> rtsp: SETUP session created id=sess-81a4 client=192.168.1.104 transport=RTP/AVP/TCP</text>
    <text x="25" y="188" class="term-text term-dim" font-size="11">13:42:12.890 <tspan class="term-yellow">[INFO]</tspan> onvif: PullMessages response emitted notification=RuleEngine/CellMotionDetector state=true</text>
    <text x="25" y="206" class="term-text term-dim" font-size="11">13:42:14.004 <tspan class="term-purple">[INFO]</tspan> ptz: ContinuousMove velocity=(x:0.42, y:0.00, z:0.00) clamping acceleration at 0.15/s²</text>
  </g>
</svg>
