<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .tui { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #e2e8f0; }
      .dim { fill: #94a3b8; }
      .dark-dim { fill: #64748b; }
      .cyan { fill: #38bdf8; }
      .green { fill: #10b981; font-weight: 700; }
      .amber { fill: #f59e0b; font-weight: 700; }
      .red { fill: #ef4444; font-weight: 700; }
      .bold { font-weight: 700; }
    </style>
    <filter id="winShadowLogs" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="15" y="15" width="1090" height="530" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#winShadowLogs)"/>

  <!-- Window Header Bar -->
  <path d="M 15 27 Q 15 15 27 15 L 1093 15 Q 1105 15 1105 27 L 1105 50 L 15 50 Z" fill="#1e293b"/>
  <line x1="15" y1="50" x2="1105" y2="50" stroke="#334155" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="38" cy="32" r="6" fill="#ef4444"/>
  <circle cx="58" cy="32" r="6" fill="#f59e0b"/>
  <circle cx="78" cy="32" r="6" fill="#10b981"/>
  <text x="560" y="36" text-anchor="middle" class="tui dark-dim" font-size="12">onvif-camera-simulator — [3] Event Log (Ring Buffer)</text>

  <!-- 1. Top Navigation Tab Bar -->
  <g transform="translate(35, 68)">
    <!-- Tab 1: Dashboard -->
    <rect x="0" y="0" width="135" height="24" rx="3" fill="#1e293b"/>
    <text x="67" y="16" text-anchor="middle" class="tui dim" font-size="12"> [1] Dashboard </text>

    <!-- Tab 2: Configuration -->
    <rect x="145" y="0" width="165" height="24" rx="3" fill="#1e293b"/>
    <text x="227" y="16" text-anchor="middle" class="tui dim" font-size="12"> [2] Configuration </text>

    <!-- Tab 3: Event Log (Active) -->
    <rect x="320" y="0" width="135" height="24" rx="3" fill="#2563eb"/>
    <text x="387" y="16" text-anchor="middle" class="tui bold" fill="#ffffff" font-size="12"> [3] Event Log </text>
  </g>

  <!-- 2. Event Log Card -->
  <g transform="translate(35, 106)">
    <rect x="0" y="0" width="1050" height="415" rx="6" fill="#121826" stroke="#3d4255" stroke-width="1.5"/>

    <!-- Header Line -->
    <g transform="translate(16, 24)">
      <text x="0" y="0" class="tui bold" fill="#ffffff">System Event Log (Ring Buffer - Last 250 Records)</text>
      
      <!-- Follow Status Badge -->
      <rect x="420" y="-13" width="195" height="18" fill="#10b981" rx="2"/>
      <text x="517" y="0" text-anchor="middle" class="tui bold" fill="#ffffff" font-size="11">FOLLOW: AUTO-SCROLL (ON)</text>

      <text x="635" y="0" class="tui">
        <tspan class="cyan bold">[f]</tspan> Toggle Follow   <tspan class="cyan bold">[c]</tspan> Clear Logs
      </text>
    </g>

    <line x1="16" y1="38" x2="1034" y2="38" stroke="#334155" stroke-width="1"/>

    <!-- Viewport Log Lines -->
    <g transform="translate(16, 62)">
      <text x="0" y="0" class="tui">
        <tspan class="dark-dim">14:03:00.012</tspan> <tspan class="green">[INFO ]</tspan> Starting ONVIF &amp; RTSP Camera Simulator <tspan class="cyan">version</tspan>=v0.2.0 <tspan class="cyan">fleet</tspan>=4
      </text>
      <text x="0" y="24" class="tui">
        <tspan class="dark-dim">14:03:00.018</tspan> <tspan class="green">[INFO ]</tspan> Starting ONVIF HTTP server <tspan class="cyan">addr</tspan>=0.0.0.0:8000 <tspan class="cyan">tls</tspan>=false
      </text>
      <text x="0" y="48" class="tui">
        <tspan class="dark-dim">14:03:00.024</tspan> <tspan class="green">[INFO ]</tspan> Starting RTSP server <tspan class="cyan">addr</tspan>=0.0.0.0:8554 <tspan class="cyan">transports</tspan>=TCP,UDP
      </text>
      <text x="0" y="72" class="tui">
        <tspan class="dark-dim">14:03:00.035</tspan> <tspan class="green">[INFO ]</tspan> Initializing fleet simulation <tspan class="cyan">cameras</tspan>=4 <tspan class="cyan">cams</tspan>=[cam0,cam1,cam2,cam3]
      </text>
      <text x="0" y="96" class="tui">
        <tspan class="dark-dim">14:03:00.040</tspan> <tspan class="green">[INFO ]</tspan> RTSP mount point published <tspan class="cyan">path</tspan>=/live/cam0/main <tspan class="cyan">cam</tspan>=cam0 <tspan class="cyan">fps</tspan>=20
      </text>
      <text x="0" y="120" class="tui">
        <tspan class="dark-dim">14:03:00.041</tspan> <tspan class="green">[INFO ]</tspan> RTSP mount point published <tspan class="cyan">path</tspan>=/live/cam0/sub <tspan class="cyan">cam</tspan>=cam0 <tspan class="cyan">fps</tspan>=10
      </text>
      <text x="0" y="144" class="tui">
        <tspan class="dark-dim">14:03:00.052</tspan> <tspan class="green">[INFO ]</tspan> WS-Discovery UDP server started <tspan class="cyan">mcast</tspan>=239.255.255.250:3702
      </text>
      <text x="0" y="168" class="tui">
        <tspan class="dark-dim">14:03:02.110</tspan> <tspan class="green">[INFO ]</tspan> SOAP request handled <tspan class="cyan">action</tspan>=GetDeviceInformation <tspan class="cyan">client</tspan>=192.168.1.104:54210 <tspan class="cyan">auth</tspan>=SUCCESS
      </text>
      <text x="0" y="192" class="tui">
        <tspan class="dark-dim">14:03:02.350</tspan> <tspan class="green">[INFO ]</tspan> RTSP client connected <tspan class="cyan">client</tspan>=192.168.1.104:54210 <tspan class="cyan">mount</tspan>=/live/cam0/main <tspan class="cyan">agent</tspan>=Frigate/0.14.1
      </text>
      <text x="0" y="216" class="tui">
        <tspan class="dark-dim">14:03:04.550</tspan> <tspan class="amber">[WARN ]</tspan> Event triggered <tspan class="cyan">topic</tspan>=RuleEngine/CellMotionDetector <tspan class="cyan">cam</tspan>=cam0 <tspan class="cyan">state</tspan>=true
      </text>
      <text x="0" y="240" class="tui">
        <tspan class="dark-dim">14:03:05.102</tspan> <tspan class="green">[INFO ]</tspan> PullMessages dispatched <tspan class="cyan">cam</tspan>=cam0 <tspan class="cyan">notifications</tspan>=1 <tspan class="cyan">sub</tspan>=sub-cam0-9418
      </text>
      <text x="0" y="264" class="tui">
        <tspan class="dark-dim">14:03:06.330</tspan> <tspan class="green">[INFO ]</tspan> PTZ ContinuousMove <tspan class="cyan">cam</tspan>=cam0 <tspan class="cyan">pan</tspan>=0.45 <tspan class="cyan">tilt</tspan>=-0.20 <tspan class="cyan">zoom</tspan>=0.60
      </text>
      <text x="0" y="288" class="tui">
        <tspan class="dark-dim">14:03:08.900</tspan> <tspan class="amber">[WARN ]</tspan> SRE Chaos injected <tspan class="cyan">type</tspan>=freeze <tspan class="cyan">duration</tspan>=5s <tspan class="cyan">cam</tspan>=cam0
      </text>
      <text x="0" y="312" class="tui">
        <tspan class="dark-dim">14:03:13.901</tspan> <tspan class="green">[INFO ]</tspan> SRE Chaos cleared <tspan class="cyan">state</tspan>=healthy <tspan class="cyan">cam</tspan>=cam0
      </text>
    </g>
  </g>
</svg>
