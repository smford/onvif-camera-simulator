<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .term-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #e2e8f0; }
      .term-dim { fill: #64748b; }
      .term-cyan { fill: #38bdf8; font-weight: 500; }
      .term-green { fill: #34d399; font-weight: 500; }
      .term-yellow { fill: #fbbf24; font-weight: 500; }
      .term-purple { fill: #a78bfa; font-weight: 500; }
      .term-red { fill: #f87171; font-weight: 500; }
      .term-bold { font-weight: 700; }
    </style>
    <linearGradient id="headerGradLogs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadowLogs" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="20" y="20" width="1060" height="500" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadowLogs)"/>

  <!-- Window Header Bar -->
  <path d="M 20 34 Q 20 20 34 20 L 1066 20 Q 1080 20 1080 34 L 1080 58 L 20 58 Z" fill="#1e293b"/>
  <line x1="20" y1="58" x2="1080" y2="58" stroke="#334155" stroke-width="1"/>

  <!-- Traffic Lights -->
  <circle cx="45" cy="39" r="6" fill="#ef4444"/>
  <circle cx="65" cy="39" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="39" r="6" fill="#10b981"/>

  <!-- Window Title -->
  <text x="550" y="43" text-anchor="middle" class="term-text term-dim" font-size="12">onvif-camera-simulator &bull; live telemetry &amp; audit log ring buffer [Tab 2]</text>

  <!-- Top Banner inside TUI -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="220" height="28" rx="4" fill="url(#headerGradLogs)"/>
    <text x="110" y="19" text-anchor="middle" class="term-text term-bold" fill="#ffffff">ONVIF &amp; RTSP SRE SIMULATOR</text>

    <rect x="225" y="0" width="795" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="240" y="19" class="term-text" font-size="12">
      <tspan class="term-dim">Buffer Depth:</tspan> <tspan class="term-green">5,000 entries</tspan>
      <tspan class="term-dim"> | Filter: </tspan><tspan class="term-cyan">ALL (Level &gt;= DEBUG)</tspan>
      <tspan class="term-dim"> | Autoscroll: </tspan><tspan class="term-green">ENABLED</tspan>
      <tspan class="term-dim"> | Keys: </tspan><tspan class="term-yellow">[↑/↓] Scroll, [c] Clear, [esc] Back</tspan>
    </text>
  </g>

  <!-- Tab Bar -->
  <g transform="translate(40, 115)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#1e293b"/>
    <text x="65" y="16" text-anchor="middle" class="term-text term-dim" font-size="11">[1] Dashboard</text>

    <rect x="140" y="0" width="120" height="24" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="200" y="16" text-anchor="middle" class="term-text term-cyan" font-size="11">[2] Live Logs</text>

    <rect x="270" y="0" width="140" height="24" rx="4" fill="#1e293b"/>
    <text x="340" y="16" text-anchor="middle" class="term-text term-dim" font-size="11">[3] Configuration</text>

    <text x="1020" y="17" text-anchor="end" class="term-text term-dim" font-size="11">Log Ingestion Rate: <tspan class="term-green">42 events/sec</tspan></text>
  </g>

  <!-- Log View Container -->
  <g transform="translate(40, 150)">
    <rect x="0" y="0" width="1020" height="340" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>

    <!-- Log Lines -->
    <text x="20" y="32" class="term-text" font-size="12">
      <tspan class="term-dim">2026-10-10 13:42:00.114</tspan> <tspan class="term-cyan">[INFO ]</tspan> <tspan class="term-purple">[server     ]</tspan> Starting dual-stream RTSP mock engine listening on 0.0.0.0:8554
    </text>
    <text x="20" y="56" class="term-text" font-size="12">
      <tspan class="term-dim">2026-10-10 13:42:00.118</tspan> <tspan class="term-cyan">[INFO ]</tspan> <tspan class="term-purple">[discovery  ]</tspan> WS-Discovery UDP listener initialized on 239.255.255.250:3702 (SO_REUSEPORT)
    </text>
    <text x="20" y="80" class="term-text" font-size="12">
      <tspan class="term-dim">2026-10-10 13:42:00.125</tspan> <tspan class="term-cyan">[INFO ]</tspan> <tspan class="term-purple">[fleet      ]</tspan> Initialized 4 virtual cameras [cam0, cam1, cam2, cam3] with dynamic HUD overlays
    </text>
    <text x="20" y="104" class="term-text" font-size="12">
      <tspan class="term-dim">2026-10-10 13:42:01.402</tspan> <tspan class="term-cyan">[INFO ]</tspan> <tspan class="term-purple">[rtsp-mount ]</tspan> Mount point /live/cam0/main active: H.264 Baseline, 1920x1080@20fps, SPS/PPS emitted
    </text>
    <text x="20" y="128" class="term-text" font-size="12">
      <tspan class="term-dim">2026-10-10 13:42:01.403</tspan> <tspan class="term-cyan">[INFO ]</tspan> <tspan class="term-purple">[rtsp-mount ]</tspan> Mount point /live/cam0/sub  active: H.264 Baseline, 640x360@10fps, SPS/PPS emitted
    </text>
    <text x="20" y="152" class="term-text" font-size="12">
      <tspan class="term-dim">2026-10-10 13:42:02.810</tspan> <tspan class="term-green">[INFO ]</tspan> <tspan class="term-purple">[onvif-soap ]</tspan> POST /onvif/cam0/device_service SOAPAction=GetDeviceInformation &rarr; Status 200 OK
    </text>
    <text x="20" y="176" class="term-text" font-size="12">
      <tspan class="term-dim">2026-10-10 13:42:03.119</tspan> <tspan class="term-green">[INFO ]</tspan> <tspan class="term-purple">[onvif-soap ]</tspan> POST /onvif/cam0/media_service SOAPAction=GetStreamUri &rarr; rtsp://127.0.0.1:8554/live/cam0/main
    </text>
    <text x="20" y="200" class="term-text" font-size="12">
      <tspan class="term-dim">2026-10-10 13:42:04.550</tspan> <tspan class="term-yellow">[WARN ]</tspan> <tspan class="term-purple">[events     ]</tspan> Motion event state change: CellMotionDetector=true on cam0 (subscribed clients: 2)
    </text>
    <text x="20" y="224" class="term-text" font-size="12">
      <tspan class="term-dim">2026-10-10 13:42:05.102</tspan> <tspan class="term-green">[INFO ]</tspan> <tspan class="term-purple">[onvif-event]</tspan> PullMessages returned 1 notification message(s) to SubscriptionId=sub-cam0-9418
    </text>
    <text x="20" y="248" class="term-text" font-size="12">
      <tspan class="term-dim">2026-10-10 13:42:06.330</tspan> <tspan class="term-cyan">[INFO ]</tspan> <tspan class="term-purple">[ptz        ]</tspan> ContinuousMove on cam0: Translation=(x:0.42, y:0.00, z:0.00), timeout=5s
    </text>
    <text x="20" y="272" class="term-text" font-size="12">
      <tspan class="term-dim">2026-10-10 13:42:07.410</tspan> <tspan class="term-green">[INFO ]</tspan> <tspan class="term-purple">[http-api   ]</tspan> GET /api/status 200 OK (fleet=4, clients=3, total_bitrate=4120kbps)
    </text>
    <text x="20" y="296" class="term-text" font-size="12">
      <tspan class="term-dim">2026-10-10 13:42:08.900</tspan> <tspan class="term-yellow">[WARN ]</tspan> <tspan class="term-purple">[chaos      ]</tspan> SRE Chaos Injection via REST: Stream freeze triggered duration=5s on cam0
    </text>
    <text x="20" y="320" class="term-text" font-size="12">
      <tspan class="term-dim">2026-10-10 13:42:13.901</tspan> <tspan class="term-green">[INFO ]</tspan> <tspan class="term-purple">[chaos      ]</tspan> SRE Chaos Cleared: Stream unpaused, normal packet delivery restored
    </text>
  </g>
</svg>
