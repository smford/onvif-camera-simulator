<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <style>
      .hud-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 15px; fill: #ffffff; letter-spacing: 0.04em; }
      .hud-label { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background Base (Dark slate matching internal/onvif/snapshot.go) -->
  <rect width="1280" height="720" fill="#181c24"/>

  <!-- Test Pattern Grid Lines (gridStep ~ 64px, stroke #282e3a) -->
  <g stroke="#282e3a" stroke-width="1">
    <line x1="64" y1="0" x2="64" y2="648"/>
    <line x1="128" y1="0" x2="128" y2="648"/>
    <line x1="192" y1="0" x2="192" y2="648"/>
    <line x1="256" y1="0" x2="256" y2="648"/>
    <line x1="320" y1="0" x2="320" y2="648"/>
    <line x1="384" y1="0" x2="384" y2="648"/>
    <line x1="448" y1="0" x2="448" y2="648"/>
    <line x1="512" y1="0" x2="512" y2="648"/>
    <line x1="576" y1="0" x2="576" y2="648"/>
    <line x1="640" y1="0" x2="640" y2="648"/>
    <line x1="704" y1="0" x2="704" y2="648"/>
    <line x1="768" y1="0" x2="768" y2="648"/>
    <line x1="832" y1="0" x2="832" y2="648"/>
    <line x1="896" y1="0" x2="896" y2="648"/>
    <line x1="960" y1="0" x2="960" y2="648"/>
    <line x1="1024" y1="0" x2="1024" y2="648"/>
    <line x1="1088" y1="0" x2="1088" y2="648"/>
    <line x1="1152" y1="0" x2="1152" y2="648"/>
    <line x1="1216" y1="0" x2="1216" y2="648"/>

    <line x1="0" y1="64" x2="1280" y2="64"/>
    <line x1="0" y1="128" x2="1280" y2="128"/>
    <line x1="0" y1="192" x2="1280" y2="192"/>
    <line x1="0" y1="256" x2="1280" y2="256"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="384" x2="1280" y2="384"/>
    <line x1="0" y1="448" x2="1280" y2="448"/>
    <line x1="0" y1="512" x2="1280" y2="512"/>
    <line x1="0" y1="576" x2="1280" y2="576"/>
  </g>

  <!-- Motion Detection Active Indicator: Red Perimeter Accent -->
  <rect x="2" y="2" width="1276" height="644" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="16 8"/>

  <!-- Analytics Bounding Box 1: Human Detection (Green #10b981 / #00ff00) -->
  <g transform="translate(680, 160)">
    <rect width="210" height="380" fill="none" stroke="#10b981" stroke-width="3"/>
    <rect x="0" y="-24" width="130" height="24" fill="#10b981"/>
    <text x="8" y="-7" class="hud-label" fill="#042f1a">HUMAN (96%)</text>
    <!-- Crosshairs inside target -->
    <line x1="95" y1="180" x2="115" y2="180" stroke="#10b981" stroke-width="2"/>
    <line x1="105" y1="170" x2="105" y2="190" stroke="#10b981" stroke-width="2"/>
  </g>

  <!-- Analytics Bounding Box 2: Vehicle Detection (Amber #f59e0b) -->
  <g transform="translate(180, 290)">
    <rect width="320" height="220" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 4"/>
    <rect x="0" y="-24" width="140" height="24" fill="#f59e0b"/>
    <text x="8" y="-7" class="hud-label" fill="#2e1402">VEHICLE (92%)</text>
  </g>

  <!-- PTZ Crosshair (Cyan #00dcff mapped to pan=0.45, tilt=-0.20) -->
  <!-- cx = (0.45+1)/2 * 1280 = 928, cy = (1 - (-0.20+1)/2) * 720 = 432 -->
  <g transform="translate(928, 432)" stroke="#00dcff" stroke-width="2">
    <!-- Horizontal lines with center gap -->
    <line x1="-32" y1="0" x2="-8" y2="0"/>
    <line x1="8" y1="0" x2="32" y2="0"/>
    <!-- Vertical lines with center gap -->
    <line x1="0" y1="-32" x2="0" y2="-8"/>
    <line x1="0" y1="8" x2="0" y2="32"/>
    <!-- Center coordinate marker -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#00dcff" stroke-width="1.5" stroke-dasharray="4 2"/>
  </g>

  <!-- SMPTE Color Bars at the Bottom (10% Height = 72px, y=648..720) -->
  <g transform="translate(0, 648)">
    <rect x="0" y="0" width="160" height="72" fill="#c8c8c8"/>
    <rect x="160" y="0" width="160" height="72" fill="#c8c800"/>
    <rect x="320" y="0" width="160" height="72" fill="#00c8c8"/>
    <rect x="480" y="0" width="160" height="72" fill="#00c800"/>
    <rect x="640" y="0" width="160" height="72" fill="#c800c8"/>
    <rect x="800" y="0" width="160" height="72" fill="#c80000"/>
    <rect x="960" y="0" width="160" height="72" fill="#0000c8"/>
    <rect x="1120" y="0" width="160" height="72" fill="#141414"/>
  </g>

  <!-- HUD Overlay Text (Top Left) -->
  <g transform="translate(24, 40)">
    <rect x="-10" y="-24" width="560" height="34" rx="4" fill="#000000" fill-opacity="0.75"/>
    <text x="0" y="0" class="hud-mono">CAM: cam0 | 2026-10-10 14:03:09 UTC | FRAME: #1420</text>
  </g>

  <!-- HUD Overlay Text (Top Right) -->
  <g transform="translate(860, 40)">
    <rect x="-10" y="-24" width="395" height="34" rx="4" fill="#000000" fill-opacity="0.75"/>
    <text x="0" y="0" class="hud-mono">PTZ: Pan=+0.45 Tilt=-0.20 Zoom=0.60</text>
  </g>

  <!-- HUD Overlay Text (Bottom Above Bars) -->
  <g transform="translate(24, 630)">
    <rect x="-10" y="-22" width="450" height="30" rx="4" fill="#000000" fill-opacity="0.75"/>
    <text x="0" y="0" class="hud-mono" font-size="13">CODEC: H.264 BASELINE | 1920x1080@20FPS</text>
  </g>
</svg>
